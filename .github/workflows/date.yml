name: Date hartă

# Descarcă OpenStreetMap, decupează județul, adaugă hidranții și construiește tile-urile.
# Rulează lunar, la orice modificare a scripturilor, sau manual.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pipeline/**", ".github/workflows/date.yml"]
  schedule:
    - cron: "17 2 1 * *"   # pe 1 ale lunii, 05:17 ora României

permissions:
  contents: write

concurrency:
  group: date
  cancel-in-progress: true

jobs:
  date:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Instrumente
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool build-essential libsqlite3-dev zlib1g-dev
          pip install --quiet shapely

      - name: Tippecanoe (din cache)
        id: tip-cache
        uses: actions/cache@v4
        with:
          path: ~/tippecanoe-bin
          key: tippecanoe-2.79.0-${{ runner.os }}

      - name: Tippecanoe (compilare)
        if: steps.tip-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 2.79.0 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)"
          mkdir -p ~/tippecanoe-bin
          cp /tmp/tippecanoe/tippecanoe ~/tippecanoe-bin/

      - name: Construiește datele
        run: |
          export PATH="$HOME/tippecanoe-bin:$PATH"
          bash pipeline/build.sh

      - name: Publică pe ramura date
        run: |
          cd dist-data
          git init -q -b date
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Date OSM $(date -u +%Y-%m-%d), din ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" date
