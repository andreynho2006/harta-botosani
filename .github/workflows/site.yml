name: Site

# Rulează testele, apoi pune împreună aplicația (web/) și datele (ramura date) pe ramura site,
# publicată cu GitHub Pages. Cu un test roșu, site-ul rămâne la versiunea de dinainte.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "tests/**", "pipeline/**", ".github/workflows/site.yml"]
  workflow_run:
    workflows: ["Date hartă"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  teste:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Chrome pentru testele de browser
        run: |
          # Fără Chrome testele de browser s-ar sări; aici lipsa lui e o eroare.
          printf '#!/bin/sh\nexec /usr/bin/google-chrome --no-sandbox "$@"\n' > "$RUNNER_TEMP/chrome"
          chmod +x "$RUNNER_TEMP/chrome"
          echo "CHROME_BIN=$RUNNER_TEMP/chrome" >> "$GITHUB_ENV"
          echo "REQUIRE_CHROME=1" >> "$GITHUB_ENV"
          /usr/bin/google-chrome --version

      - name: Teste JavaScript
        run: node --test tests/*.test.mjs

      - name: Teste Python
        run: |
          pip install --quiet mapbox-vector-tile==2.2.0
          python -m unittest discover -s tests -p 'test_*.py' -v

  site:
    needs: teste
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Aplicație + date
        run: |
          git clone -q --depth 1 --branch date "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/date
          mkdir -p site
          cp -r web/. site/
          cp -r /tmp/date/tiles /tmp/date/data site/
          rm -f site/data/hidranti.geojson   # hidranții se publică doar criptați (web/data/hidranti.enc)
          rm -f site/data/hidrografie*.geojson   # cadastrul apelor ABA se publică doar criptat (web/data/hidrografie.enc)
          printf '/tiles/*\n  Cache-Control: public, max-age=86400\n/vendor/*\n  Cache-Control: public, max-age=604800\n/fonts/*\n  Cache-Control: public, max-age=604800\n' > site/_headers
          touch site/.nojekyll

      - name: Publică pe ramura site
        run: |
          cd site
          git init -q -b site
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site din ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
